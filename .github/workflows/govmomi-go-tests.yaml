name: Unit Tests

permissions:
  contents: read
  actions: read

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  go-tests:
    name: Run Unit Tests
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
        platform: [ubuntu-latest]
        include:
          # Run the container-backed simulator tests with rootless podman as the
          # docker CLI too. The platform differs from the entries above so that
          # this is an extra job rather than a change to one of them.
          - go-version: "1.26"
            platform: ubuntu-24.04
            container-cli: podman
      fail-fast: false

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10

    steps:
      - name: Check Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Use podman as the docker CLI
        if: matrix.container-cli == 'podman'
        run: |
          mkdir -p "$HOME/podman-docker"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$HOME/podman-docker/docker"
          chmod +x "$HOME/podman-docker/docker"
          echo "$HOME/podman-docker" >> "$GITHUB_PATH"

      - name: Run Tests
        env:
          TEST_COUNT: 1
          TEST_RACE_HISTORY_SIZE: 5
          TEST_TIMEOUT: 5m
          TEST_OPTS: ""
        run: make go-test
